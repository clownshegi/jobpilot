services:
  pgsql:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:-jobpilot}"
      POSTGRES_USER: "${DB_USERNAME:-jobpilot}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - pgsql-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jobpilot} -d ${DB_DATABASE:-jobpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Queue workers. Runs the app code from the mounted project directory;
  # inside the network the database, Redis and Reverb are reached by service name.
  horizon: &php
    build: ./docker/php
    image: jobpilot-php
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: pgsql
      REDIS_HOST: redis
      REVERB_HOST: reverb
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # WebSocket server for real-time updates; the browser connects to localhost:8080.
  reverb:
    <<: *php
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_PORT:-8080}:8080"

volumes:
  pgsql-data:
  redis-data:
